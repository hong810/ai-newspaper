<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="AI 情报报纸 · 自动汇聚海内外 AI 新闻、GitHub 开源项目、arXiv 论文与模型趋势，自动生成日报 / 周报 / 月报">
<title>AI 情报 · 日报 / 周报 / 月报</title>
<style>
:root{
  --paper:#f5f0e4;
  --paper-2:#efe8d8;
  --ink:#191713;
  --ink-2:#3d3830;
  --muted:#7a7264;
  --rule:#cdc4b1;
  --rule-strong:#8f8574;
  --red:#a52a1e;
  --serif:"Songti SC","STSong","SimSun","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  line-height:1.62;
  background-image:
    radial-gradient(circle at 18% 8%, rgba(255,255,255,.5), transparent 55%),
    radial-gradient(circle at 82% 92%, rgba(190,175,145,.16), transparent 60%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.012) 0 1px, transparent 1px 3px);
}
.wrap{max-width:1280px;margin:0 auto;padding:0 26px 56px}
a{color:inherit}
::selection{background:rgba(165,42,30,.18)}

/* ---------- 报头 ---------- */
.masthead{position:relative;padding-top:12px}
.mast-top{
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;color:var(--muted);
  padding:10px 0;border-bottom:1px solid var(--rule);
}
.mast-main{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;
  padding:16px 0 6px;
}
.mast-side{font-family:var(--sans);font-size:11.5px;color:var(--muted);line-height:1.95;letter-spacing:.06em}
.mast-side.right{text-align:right}
.mast-title{
  margin:0;text-align:center;font-weight:900;line-height:1;
  font-size:clamp(46px,8.2vw,86px);
  letter-spacing:.16em;text-indent:.16em;
  font-family:var(--serif);
}
.mast-title span{color:var(--red)}
.mast-sub{
  text-align:center;font-family:var(--sans);font-size:10.5px;letter-spacing:.3em;
  color:var(--muted);padding:6px 0 10px;border-bottom:3px double var(--ink);
}
.seal{
  position:absolute;right:2px;top:44px;width:78px;height:78px;
  border:2.5px solid var(--red);border-radius:7px;color:var(--red);
  display:grid;place-items:center;font-size:17px;font-weight:700;letter-spacing:.18em;
  writing-mode:vertical-rl;text-orientation:upright;transform:rotate(-7deg);opacity:.82;
  pointer-events:none;user-select:none;padding:6px;
  box-shadow:inset 0 0 0 1px rgba(165,42,30,.18);
}

/* ---------- 导航 ---------- */
.tabs{display:flex;justify-content:center;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.tab{
  font-family:var(--sans);font-size:14.5px;letter-spacing:.2em;padding:13px 30px;
  background:none;border:none;cursor:pointer;color:var(--ink-2);position:relative;
  transition:color .15s;
}
.tab:hover{color:var(--red)}
.tab.active{color:var(--red);font-weight:700}
.tab.active::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:2px;background:var(--red)}
.tab .badge{font-size:10px;letter-spacing:0;color:var(--muted);margin-left:6px;font-weight:400}

/* ---------- 快讯条 ---------- */
.ticker{
  display:flex;align-items:center;gap:14px;overflow:hidden;
  border-bottom:1px solid var(--rule);padding:9px 0;font-size:13px;
}
.ticker-label{
  color:var(--red);font-family:var(--sans);font-size:11.5px;letter-spacing:.18em;
  white-space:nowrap;flex:none;border:1px solid var(--red);padding:1px 7px;
}
.ticker-view{overflow:hidden;flex:1;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.ticker-track{display:inline-flex;gap:44px;white-space:nowrap;animation:marq 90s linear infinite;will-change:transform}
.ticker-view:hover .ticker-track{animation-play-state:paused}
.ticker-track a{text-decoration:none;color:var(--ink-2);font-size:13px}
.ticker-track a:hover{color:var(--red);text-decoration:underline}
.ticker-track b{color:var(--red);font-weight:400;font-family:var(--sans);font-size:11px;margin-left:6px}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- 工具条 ---------- */
.toolbar{
  position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--rule);
  background:linear-gradient(var(--paper) 72%, rgba(245,240,228,.86));
  backdrop-filter:blur(3px);
}
.btn{
  font-family:var(--sans);font-size:12.5px;letter-spacing:.06em;cursor:pointer;
  border:1px solid var(--rule-strong);background:transparent;color:var(--ink);
  padding:6px 13px;border-radius:2px;transition:all .15s;
}
.btn:hover{border-color:var(--ink);background:rgba(0,0,0,.03)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.5;cursor:default}
.switch{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none}
.switch input{accent-color:var(--red);width:14px;height:14px}
input.search{
  flex:1 1 220px;min-width:170px;font-family:var(--sans);font-size:12.5px;
  padding:6px 10px;border:1px solid var(--rule-strong);background:rgba(255,255,255,.45);
  color:var(--ink);border-radius:2px;outline:none;
}
input.search:focus{border-color:var(--ink);background:#fff}
select{
  font-family:var(--sans);font-size:12.5px;padding:6px 8px;border:1px solid var(--rule-strong);
  background:rgba(255,255,255,.45);color:var(--ink);border-radius:2px;outline:none;
}
.refresh-status{margin-left:auto;font-family:var(--sans);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.refresh-status.busy{color:var(--red)}
.refresh-status.busy::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

.proxy-flag{
  font-family:var(--sans);font-size:10.5px;letter-spacing:.04em;border:1px solid var(--rule);
  padding:2px 8px;border-radius:10px;color:var(--muted);cursor:default;white-space:nowrap;
}
.proxy-flag.ok{border-color:rgba(90,120,70,.5);color:#4a6b3a;background:rgba(90,120,70,.07)}
.proxy-flag.off{border-color:rgba(165,42,30,.35);color:var(--red);background:rgba(165,42,30,.05)}

/* ---------- 头版 ---------- */
.paper{min-height:50vh}
.front{
  display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);
  border-bottom:1px solid var(--rule);
}
.lead-main{padding:24px 28px 26px 0;border-right:1px solid var(--rule);min-width:0}
.kicker{
  font-family:var(--sans);font-size:11.5px;letter-spacing:.2em;color:var(--red);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.kicker .dot{width:6px;height:6px;background:var(--red);border-radius:50%}
.lead-title{
  font-size:clamp(27px,3.1vw,41px);line-height:1.3;font-weight:800;margin:12px 0 14px;letter-spacing:.01em;
}
.lead-title a{text-decoration:none}
.lead-title a:hover{color:var(--red)}
.lead-sum{
  font-size:15px;color:var(--ink-2);border-left:3px solid var(--red);
  padding:2px 0 2px 14px;margin:0 0 14px;
}
.lead-meta{font-family:var(--sans);font-size:11.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;letter-spacing:.03em}
.lead-meta .src{color:var(--red)}
.lead-side{padding:24px 0 26px 26px;min-width:0}
.side-head{
  font-family:var(--sans);font-size:12px;letter-spacing:.24em;color:var(--muted);
  border-bottom:1px solid var(--ink);padding-bottom:5px;margin-bottom:4px;display:flex;justify-content:space-between;
}
.rank{list-style:none;margin:0;padding:0;counter-reset:rk}
.rank li{
  counter-increment:rk;display:flex;gap:10px;padding:9px 0;border-bottom:1px dotted var(--rule);font-size:14px;line-height:1.45;
}
.rank li::before{
  content:counter(rk);font-family:Georgia,serif;font-size:15px;color:var(--red);
  min-width:18px;font-weight:700;line-height:1.35;
}
.rank a{text-decoration:none}
.rank a:hover{color:var(--red);text-decoration:underline}
.rank .rmeta{display:block;font-family:var(--sans);font-size:10.5px;color:var(--muted);margin-top:2px}

.stat-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:18px;
}
.stat{background:var(--paper);padding:10px 12px}
.stat b{display:block;font-family:Georgia,serif;font-size:23px;line-height:1.25;letter-spacing:.01em}
.stat span{font-family:var(--sans);font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.stat i{font-style:normal;font-size:13px;color:var(--muted)}

/* ---------- 分栏 ---------- */
.sections{column-count:3;column-gap:34px;padding-top:26px}
.sec{break-inside:avoid;margin-bottom:30px}
.sec-head{
  display:flex;align-items:baseline;gap:9px;border-bottom:2px solid var(--ink);
  padding-bottom:4px;margin-bottom:6px;
}
.sec-head h3{font-size:19px;margin:0;letter-spacing:.1em;font-weight:800}
.sec-head .en{font-family:var(--sans);font-size:9.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.sec-head .cnt{margin-left:auto;font-family:var(--sans);font-size:10.5px;color:var(--muted)}
.item{padding:9px 0;border-bottom:1px dotted var(--rule)}
.item:last-child{border-bottom:none}
.item h4{margin:0;font-size:14.8px;line-height:1.46;font-weight:700;letter-spacing:.005em}
.item h4 a{text-decoration:none}
.item h4 a:hover{color:var(--red);text-decoration:underline}
.item .meta{font-family:var(--sans);font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;letter-spacing:.02em}
.item .meta .src{color:var(--ink-2)}
.item .meta .hot{color:var(--red)}
.item .sum{
  margin:5px 0 0;font-size:12.5px;color:var(--ink-2);opacity:.92;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* ---------- 周报 / 月报 ---------- */
.week-top{padding:26px 0 6px;border-bottom:1px solid var(--rule)}
.week-head{
  display:flex;align-items:baseline;gap:12px;border-bottom:3px double var(--ink);padding-bottom:6px;margin-bottom:14px;
}
.week-head h2{margin:0;font-size:26px;letter-spacing:.12em}
.week-head .en{font-family:var(--sans);font-size:10px;letter-spacing:.2em;color:var(--muted)}
.top-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px;padding-bottom:8px}
.top-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px dotted var(--rule);min-width:0}
.top-item .no{
  font-family:Georgia,serif;font-size:30px;line-height:1;color:var(--red);
  opacity:.55;font-weight:700;min-width:36px;
}
.top-item h4{margin:0;font-size:16px;line-height:1.45}
.top-item h4 a{text-decoration:none}
.top-item h4 a:hover{color:var(--red);text-decoration:underline}
.top-item .meta{font-family:var(--sans);font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.top-item .sum{font-size:12.5px;color:var(--ink-2);margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.charts{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);margin:24px 0 0}
.panel{background:var(--paper);padding:16px 18px;min-width:0}
.panel h3{margin:0 0 12px;font-size:14.5px;letter-spacing:.12em;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
.panel h3 small{font-family:var(--sans);font-size:10px;color:var(--muted);letter-spacing:.04em;font-weight:400}
.bars{display:flex;align-items:flex-end;gap:4px;height:96px}
.bar{flex:1;position:relative;background:var(--rule);min-width:4px;height:100%;display:flex;align-items:flex-end}
.bar i{display:block;width:100%;background:linear-gradient(180deg,var(--red),#7d1f16);opacity:.82}
.bar.b0 i{background:var(--rule)}
.bar-labels{display:flex;gap:4px;font-family:var(--sans);font-size:9px;color:var(--muted);margin-top:4px}
.bar-labels span{flex:1;text-align:center;white-space:nowrap;overflow:hidden}
.hbar{display:grid;grid-template-columns:64px 1fr 32px;gap:8px;align-items:center;font-family:var(--sans);font-size:11px;margin-bottom:7px}
.hbar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.hbar .tr{height:8px;background:rgba(0,0,0,.06)}
.hbar .tr i{display:block;height:100%;background:var(--red);opacity:.72}
.hbar .vl{text-align:right;color:var(--muted);font-size:10px}

/* 关键词 */
.cloud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;line-height:1.15;padding:4px 0}
.cloud span{color:var(--ink);opacity:.72;white-space:nowrap}
.cloud span:nth-child(3n){color:var(--red);opacity:.8}

/* 大事记 */
.timeline{column-count:2;column-gap:36px;margin-top:6px}
.tl-item{break-inside:avoid;display:flex;gap:12px;padding:10px 0;border-bottom:1px dotted var(--rule)}
.tl-item time{font-family:var(--sans);font-size:10.5px;color:var(--red);min-width:42px;letter-spacing:.04em;padding-top:2px}
.tl-item .tx{font-size:14px;line-height:1.5}
.tl-item a{text-decoration:none}
.tl-item a:hover{color:var(--red);text-decoration:underline}
.tl-item .src{display:block;font-family:var(--sans);font-size:10px;color:var(--muted);margin-top:2px}

/* ---------- 采集状态 ---------- */
.status-bar{
  margin-top:30px;border-top:3px double var(--ink);padding:14px 0 0;
  font-family:var(--sans);font-size:11px;color:var(--muted);
}
.status-bar .st-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.status-bar .st-head b{font-size:11.5px;letter-spacing:.16em;color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px}
.chip{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:1px solid var(--rule);padding:3px 9px;border-radius:2px;
  font-size:10.5px;color:var(--ink-2);background:rgba(255,255,255,.38);
}
.chip.ok{border-color:rgba(120,140,100,.45)}
.chip.fail{border-color:rgba(165,42,30,.4);color:var(--red);background:rgba(165,42,30,.05)}
.chip b{font-weight:400;color:var(--muted);margin-left:auto}
.chip.fail b{color:var(--red)}

/* ---------- 数据源页 ---------- */
.sources-page{padding-top:24px}
.panel-block{border:1px solid var(--rule);background:rgba(255,255,255,.28);padding:20px 22px;margin-bottom:20px}
.panel-block h2{margin:0 0 12px;font-size:19px;letter-spacing:.1em;border-bottom:1px solid var(--rule);padding-bottom:6px}
.panel-block p{margin:8px 0;font-size:13.5px;color:var(--ink-2)}
.panel-block ul{margin:8px 0;padding-left:20px;font-size:13.5px;color:var(--ink-2)}
.panel-block li{margin:4px 0}
.panel-block code{font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.05);padding:1px 5px;border-radius:2px}
.src-table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:12px}
.src-table th,.src-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule)}
.src-table th{color:var(--muted);font-weight:400;letter-spacing:.08em;font-size:10.5px;text-transform:uppercase}
.src-table td.ok{color:#4a6b3a}
.src-table td.fail{color:var(--red)}
.settings-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:12px 0}
.settings-row label{font-family:var(--sans);font-size:12px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.settings-row input[type=text]{
  width:290px;font-family:var(--mono);font-size:11.5px;padding:6px 8px;
  border:1px solid var(--rule-strong);background:rgba(255,255,255,.55);outline:none;
}
.hint{font-family:var(--sans);font-size:11.5px;color:var(--muted);line-height:1.8}
.hint b{color:var(--ink-2);font-weight:600}

/* ---------- 状态：加载 / 空 / 错误 ---------- */
.loading-pane{padding:30px 0}
.load-title{font-size:22px;letter-spacing:.14em;font-weight:800}
.load-sub{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:6px}
.src-chips{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 6px;min-height:24px}
.skeleton{display:grid;grid-template-columns:2.15fr 1fr;gap:34px;margin-top:26px}
.sk-col{border-right:1px solid var(--rule);padding-right:34px}
.sk-line{height:13px;background:linear-gradient(90deg,#e6ddca 25%,#f3edde 50%,#e6ddca 75%);background-size:200% 100%;animation:shimmer 1.5s infinite linear;margin-bottom:11px;border-radius:2px}
.sk-line.lg{height:30px}
.sk-line.md{height:19px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{border:1px solid var(--rule);padding:34px;text-align:center;margin:30px 0}
.empty h3{margin:0 0 8px;font-size:20px;letter-spacing:.1em}
.empty p{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin:6px 0}
.notice{
  border:1px solid rgba(165,42,30,.35);background:rgba(165,42,30,.045);
  padding:12px 16px;font-family:var(--sans);font-size:12px;color:var(--ink-2);margin:14px 0;
}
.notice b{color:var(--red)}

footer{
  margin-top:30px;border-top:3px double var(--ink);padding-top:16px;
  font-family:var(--sans);font-size:10.5px;color:var(--muted);line-height:1.9;
  display:grid;gap:3px;justify-items:center;text-align:center;
}
footer .foot-brand{font-family:var(--serif);font-size:14px;letter-spacing:.32em;color:var(--ink-2);text-indent:.32em}
footer .foot-note{max-width:760px;margin:0}
footer #foot-meta{font-variant-numeric:tabular-nums;letter-spacing:.06em}

/* ---------- 结尾 ---------- */
.end-mark{
  display:flex;align-items:center;gap:18px;margin:34px 0 0;
  font-family:var(--sans);font-size:10.5px;letter-spacing:.4em;color:var(--muted);
  text-indent:.4em;white-space:nowrap;
}
.end-mark::before,.end-mark::after{content:"";flex:1;height:1px;background:var(--rule)}

/* ---------- 模型排行榜 ---------- */
.model-board{margin-top:26px;border:1px solid var(--rule);background:rgba(255,255,255,.3)}
.board-head{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:12px 16px 8px;border-bottom:2px solid var(--ink);
}
.board-head h3{margin:0;font-size:18px;letter-spacing:.12em;font-weight:800}
.board-head .en{font-family:var(--sans);font-size:9.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.board-head .note{margin-left:auto;font-family:var(--sans);font-size:10.5px;color:var(--muted)}
.m-table{padding:4px 16px 12px}
.m-head,.m-row{
  display:grid;grid-template-columns:34px minmax(0,1fr) 110px 62px 62px;
  gap:12px;align-items:center;padding:7px 0;border-bottom:1px dotted var(--rule);
}
.m-head{font-family:var(--sans);font-size:9.5px;letter-spacing:.14em;color:var(--muted);border-bottom:1px solid var(--rule)}
.m-head span:last-child,.m-head span:nth-last-child(2){text-align:right}
.m-row:last-child{border-bottom:none}
.m-no{font-family:Georgia,serif;font-size:15px;color:var(--red);opacity:.62;font-variant-numeric:tabular-nums}
.m-row:nth-child(2) .m-no{opacity:1;font-weight:700}
.m-name{min-width:0}
.m-name a{display:block;font-size:13.5px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-name a:hover{color:var(--red);text-decoration:underline}
.m-task{display:block;font-family:var(--sans);font-size:9.5px;color:var(--muted);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-bar{height:6px;background:rgba(0,0,0,.06)}

var LocalProxy = { base: "http://127.0.0.1:8765", ok: false, ready: null };

function detectLocalProxy(force){
  if(LocalProxy.ready && !force) return LocalProxy.ready;
  LocalProxy.ready = new Promise(function(resolve){
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 1800) : null;

        if(timer) clearTimeout(timer);
        updateProxyBadge();
        resolve(LocalProxy.ok);
      });
  });
  return LocalProxy.ready;

var mem = new Map();   // 会话级请求缓存（跨日报/周报/月报复用）
function memo(key, ttl, fn){
  var hit = mem.get(key);
  if(hit && Date.now() - hit.at < ttl) return hit.p;
  var p = fn();
  mem.set(key, { at: Date.now(), p: p });
  p.catch(function(){ mem.delete(key); });
  return p;
}

/* =========================================================
   2. 网络层
   ========================================================= */
function fetchText(url, options, timeout){
  options = options || {};
  timeout = timeout || 14000;
  var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, timeout) : null;
  var opt = { signal: ctrl ? ctrl.signal : undefined, cache: "no-store" };
  if(options.headers) opt.headers = options.headers;
  return fetch(url, opt).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function(t){
    if(timer) clearTimeout(timer);
    return t;
  }, function(e){
    if(timer) clearTimeout(timer);
    throw e;
  });
}
function fetchJSON(url, options, timeout){
  return fetchText(url, options, timeout).then(function(t){
    try{ return JSON.parse(t); }
    catch(e){ throw new Error("JSON 解析失败"); }
  });
}
function fetchViaProxy(url, timeout){
  return detectLocalProxy().then(function(ok){
    if(ok){
      return fetchText(LocalProxy.base + "/proxy?url=" + encodeURIComponent(url), {}, timeout || 20000);
    }
    return fetchPublicProxy(url, timeout);
  });
}
function fetchPublicProxy(url, timeout){
  var start = proxyTurn++ % PROXIES.length;
  var order = [];
  for(var i = 0; i < PROXIES.length; i++) order.push(PROXIES[(start + i) % PROXIES.length]);

  function attempt(i){
    if(i >= order.length) return Promise.reject(new Error("全部代理均失败"));
    return fetchText(order[i](url), {}, timeout || 9000).then(function(txt){
      if(!txt || txt.length < 80) throw new Error("代理返回空内容");
      if(/^\s*<!doctype html/i.test(txt) && txt.length < 400) throw new Error("代理返回错误页");
      return txt;
    }).catch(function(){ return attempt(i + 1); });
  }
  return attempt(0);
}
function fetchJSONSmart(url){
  return detectLocalProxy().then(function(ok){
    if(!ok) return fetchJSON(url);
    return fetchText(LocalProxy.base + "/proxy?url=" + encodeURIComponent(url), {}, 20000).then(function(t){
      try{ return JSON.parse(t); }
      catch(e){ throw new Error("JSON 解析失败"); }
    });
  });
}
function pool(tasks, limit){
  var queue = tasks.slice();
  var workers = [];
  var n = Math.min(limit, queue.length);
  for(var i = 0; i < n; i++){
    workers.push((function loop(){
      if(!queue.length) return Promise.resolve();
      var t = queue.shift();
      return t().catch(function(){ /* 单任务失败已记录 */ }).then(loop);
    })());
  }
  return Promise.all(workers);
}

/* =========================================================
   2.5 开源与工具：英文简介中文化
   走本地代理调用翻译接口，失败保留原文，不阻断采集。
   ========================================================= */
var GT_BASE = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=";
var ZH_MEMO = {};

function translateOne(text){
  text = String(text || "").replace(/\s+/g, " ").trim();
  if(!text || /[\u4e00-\u9fa5]/.test(text) || !/[A-Za-z]{3}/.test(text)) return Promise.resolve(text);
  if(ZH_MEMO[text] != null) return Promise.resolve(ZH_MEMO[text]);
  return fetchViaProxy(GT_BASE + encodeURIComponent(text.slice(0, 800)), 10000).then(function(txt){
    var data = JSON.parse(txt);
    var out = (data[0] || []).map(function(seg){ return (seg && seg[0]) || ""; }).join("").trim();
    if(!out) throw new Error("空译文");
    ZH_MEMO[text] = out;
    return out;
  }).catch(function(){ return text; });
}

function zhGithubItem(a){
  var repo = String(a.title || "").split(" · ")[0];
  var desc = String(a.summary || "").trim();
  return translateOne(desc).then(function(zh){
    var ex = a.extra || {};
    var parts = ["开源项目 " + repo];
    if(ex.lang) parts.push("主要语言 " + ex.lang);
    if(ex.stars != null) parts.push("星标 " + fmtNum(ex.stars));
    if(ex.forks != null) parts.push("Fork " + fmtNum(ex.forks));
    var intro = parts.join(" · ") + "。";
    if(zh && zh !== desc) intro += "简介：" + zh;
    else if(desc) intro += "简介（原文）：" + desc;
    else intro += "仓库暂无简介。";
    a.title = repo;
    a.summary = intro;
  });
}

function zhTextItem(a){
  var t = String(a.title || ""), s = String(a.summary || "");
  return translateOne(t).then(function(zt){
    a.title = zt || t;
    return translateOne(s);
  }).then(function(zs){ a.summary = zs || s; });
}

function zhLocalize(list){
  var targets = list.filter(function(a){
    if(a.cat !== "开源与工具" || a.lang !== "en") return false;
    return /[A-Za-z]/.test((a.title || "") + " " + (a.summary || ""));
  }).slice(0, 30);
  if(!targets.length) return Promise.resolve();
  return pool(targets.map(function(a){
    return function(){
      return (a.platform === "github" ? zhGithubItem(a) : zhTextItem(a)).catch(function(){});
    };
  }), 4);
}

/* =========================================================
   3. RSS 解析
   ========================================================= */
function childText(el, names){
  for(var i = 0; i < names.length; i++){
    var name = names[i].toLowerCase();
    var kids = el.children || [];
    for(var j = 0; j < kids.length; j++){
      var c = kids[j];
      if(c.localName && c.localName.toLowerCase() === name && c.textContent && c.textContent.trim()){
        return c.textContent.trim();
      }
    }
  }
  return "";
}
function childLink(el){
  var kids = el.children || [];
  for(var i = 0; i < kids.length; i++){
    var c = kids[i];
    if(c.localName === "link"){
      if(c.getAttribute("href")) return c.getAttribute("href");
      if(c.textContent && c.textContent.trim()) return c.textContent.trim();
    }
  }
  return "";
}
function parseFeed(xml, source){
  var doc;
  try{ doc = new DOMParser().parseFromString(xml, "text/xml"); }
  catch(e){ throw new Error("RSS 解析失败"); }
  if(doc.querySelector("parsererror")) throw new Error("RSS 格式错误");

  var nodes = Array.prototype.slice.call(doc.getElementsByTagName("item"))
    .concat(Array.prototype.slice.call(doc.getElementsByTagName("entry")));

  return nodes.map(function(n){
    var title = stripHtml(childText(n, ["title"]));
    var link = childLink(n);
    var tsRaw = childText(n, ["pubDate","published","updated","date","dc:date"]);
    var ts = Date.parse(tsRaw) || 0;
    var sum = stripHtml(childText(n, ["description","summary","content","content:encoded","encoded"]));
    return {
      title: title,
      url: link,
      ts: ts,
      summary: sum.slice(0, 220),
      source: source.name,
      sourceId: source.id,
      lang: source.lang || "en",
      platform: "rss",
      weight: 0
    };
  }).filter(function(a){
    return a.title && a.url && a.ts > 0;
  });
}
function loadFeed(f, cutoff){
  return memo("feed:" + f.id, 20 * 60000, function(){
    return fetchViaProxy(f.url).then(function(xml){
      return parseFeed(xml, f);
    });
  }).then(function(list){
    return list.filter(function(a){
      if(a.ts < cutoff || a.ts > Date.now() + 6 * 3600000) return false;
      if(f.general && !AI_RE.test(a.title + " " + (a.summary || ""))) return false;
      return true;
    });
  });
}

var RULES = [
  ["政策与治理", /监管|法案|合规|诉讼|版权|立法|禁令|审查|治理|版权|regulation|lawsuit|copyright|antitrust|\bban\b|policy|governance|\bact\b|safety institute/i],

  ["产业与资本", /融资|投资|收购|估值|上市|IPO|独角兽|营收|财报|裁员|合作|funding|raises?\b|acquisition|valuation|\bIPO\b|revenue|partnership|layoff|billion|million/i],

  ["开源与工具", /GitHub|开源|仓库|框架|库|工具|插件|SDK|open.?source|\brepo\b|framework|library|toolkit|tool\b/i],
  ["模型与产品", /发布|推出|上线|大模型|多模态|智能体|Agent|GPT|Gemini|Claude|Llama|Qwen|DeepSeek|Mistral|Sora|助手|Copilot|功能|模型|\bapp\b|model|launch|release|introduc|rollout|update/i],
  ["观点与教程", /教程|指南|如何|观点|访谈|复盘|解读|科普|评测|tutorial|guide|how to|opinion|interview|review|explainer|lessons/i]
];
function classify(a){
  if(a.cat) return a.cat;
  var text = (a.title || "") + " " + (a.summary || "");
  for(var i = 0; i < RULES.length; i++){
    if(RULES[i][1].test(text)) return RULES[i][0];
  }
  return "其他动态";
}

function normTitle(t){
  return String(t || "").toLowerCase().replace(/[\s\p{P}\p{S}]/gu, "").slice(0, 70);
}
function urlKey(u){
  try{
    var x = new URL(u);
    return x.host.replace(/^www\./, "") + x.pathname.replace(/\/$/, "");
  }catch(e){ return ""; }
}
function dedupe(list){
  var map = new Map();
  for(var i = 0; i < list.length; i++){
    var a = list[i];
    var k1 = normTitle(a.title);
    var k2 = urlKey(a.url);
    var prev = map.get(k1) || (k2 ? map.get(k2) : null);
    if(!prev){
      map.set(k1, a);
      if(k2) map.set(k2, a);
    }else if(heatOf(a, 8) > heatOf(prev, 8)){
      map.set(k1, a);
      if(k2) map.set(k2, a);
    }
  }
  var out = [], seen = new Set();
  map.forEach(function(v){
    if(!seen.has(v)){ seen.add(v); out.push(v); }
  });
  return out;
}

function buildTasks(period, cutoff, sinceDate){
  var tasks = [];
  var days = PERIODS[period].days;

  tasks.push({ id:"hn-ai", name:"Hacker News", kind:"API", run:function(){ return loadHN("AI", cutoff); } });
  tasks.push({ id:"hn-llm", name:"Hacker News", kind:"API", run:function(){ return loadHN("LLM", cutoff); } });
  tasks.push({ id:"gh-new", name:"GitHub 新项目", kind:"API", run:function(){ return loadGitHub("new", sinceDate, cutoff); } });
  tasks.push({ id:"gh-hot", name:"GitHub 热门", kind:"API", run:function(){ return loadGitHub("hot", sinceDate, cutoff); } });
  tasks.push({ id:"hf", name:"Hugging Face", kind:"API", run:function(){ return loadHF(); } });
  tasks.push({ id:"arxiv", name:"arXiv", kind:"API", run:function(){ return loadArxiv(cutoff); } });
  tasks.push({ id:"devto", name:"Dev.to", kind:"API", run:function(){ return loadDevTo(period); } });
  tasks.push({ id:"openalex", name:"OpenAlex", kind:"API", run:function(){ return loadOpenAlex(days); } });

  FEEDS.forEach(function(f){
    tasks.push({ id:"rss-" + f.id, name:f.name, kind:"RSS", run:function(){ return loadFeed(f, cutoff); } });
  });
  GN.forEach(function(g){
    tasks.push({ id:"gn-" + g.id, name:g.name, kind:"RSS", run:function(){ return loadGoogleNews(g, days); } });
  });
  return tasks;
}

function attemptTask(run, retries){
  return Promise.resolve().then(run).catch(function(err){
    if(retries <= 0) throw err;
    return new Promise(function(r){ setTimeout(r, 700); }).then(function(){
      return attemptTask(run, retries - 1);
    });
  });
}

function collect(period, onStatus){
  var p = PERIODS[period];
  var cutoff = Date.now() - p.days * DAY;
  var sinceDate = new Date(cutoff).toISOString().slice(0, 10);
  var tasks = buildTasks(period, cutoff, sinceDate);
  var statuses = new Map();
  var all = [];

  var wrapped = tasks.map(function(t){
    return function(){
      var start = performance.now();
      return attemptTask(t.run, 1).then(function(list){
        var arr = Array.isArray(list) ? list : [];
        all = all.concat(arr);
        statuses.set(t.id, {
          id: t.id, name: t.name, kind: t.kind, ok: true,
          count: arr.length, ms: Math.round(performance.now() - start)
        });
        if(onStatus) onStatus(statuses);
      }, function(err){
        statuses.set(t.id, {
          id: t.id, name: t.name, kind: t.kind, ok: false,
          count: 0, ms: Math.round(performance.now() - start),
          error: describeError(err)
        });
        if(onStatus) onStatus(statuses);
        throw err;
      });
    };
  });

  return pool(wrapped, 5).then(function(){
    var list = all.filter(function(a){
      return a.ts >= cutoff - 60 * 60000 && a.ts <= Date.now() + 6 * 3600000;
    });
    for(var i = 0; i < list.length; i++) list[i].cat = classify(list[i]);
    list = dedupe(list);
    list.sort(function(a, b){ return b.ts - a.ts; });

    var trending = all.filter(function(a){ return a.platform === "hf"; })
      .sort(function(a, b){ return (b.weight || 0) - (a.weight || 0); })
      .slice(0, 12);

    return {
      period: period,
      generatedAt: Date.now(),
      articles: list,
      trending: trending,
      statuses: Array.from(statuses.values())
    };
  }).then(function(rep){
    return zhLocalize(rep.articles).then(function(){ return rep; });
  });
}

function filtered(list){
  var q = Filter.q.trim().toLowerCase();
  return list.filter(function(a){
    if(Filter.lang !== "all" && a.lang !== Filter.lang) return false;
    if(Filter.src !== "all" && a.source !== Filter.src) return false;
    if(q){
      var text = (a.title + " " + (a.summary || "") + " " + a.source).toLowerCase();
      if(text.indexOf(q) === -1) return false;
    }
    return true;
  });
}

function itemHTML(a, period, withSummary){
  var meta = [];
  meta.push('<span class="src">' + esc(a.source) + "</span>");
  meta.push("<span>" + fmtTime(a.ts, period) + "</span>");
  if(a.platform === "hn" && a.weight) meta.push('<span class="hot">热度 ' + a.weight + "</span>");
  if(a.platform === "github" && a.extra && a.extra.stars != null){
    meta.push('<span class="hot">★ ' + fmtNum(a.extra.stars) + "</span>");
    if(a.extra.lang) meta.push("<span>" + esc(a.extra.lang) + "</span>");
  }
  if(a.platform === "reddit" && a.weight) meta.push('<span class="hot">▲ ' + fmtNum(a.weight) + "</span>");
  if(a.platform === "devto" && a.weight) meta.push('<span class="hot">♥ ' + fmtNum(a.weight) + "</span>");
  if(a.platform === "openalex" && a.weight) meta.push('<span class="hot">引用 ' + fmtNum(a.weight) + "</span>");
  if(a.comments) meta.push("<span>" + a.comments + " 评论</span>");
  if(a.platform === "arxiv") meta.push('<span class="tag">论文</span>');

  var sum = (withSummary && a.summary) ? '<p class="sum">' + esc(a.summary) + "</p>" : "";
  return '<article class="item"><h4><a href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">' +

function sectionHTML(cat, items, period, limit){
  if(!items.length) return "";

function statHTML(rep){
  var list = filtered(rep.articles);
  var zh = list.filter(function(a){ return a.lang === "zh"; }).length;
  var en = list.filter(function(a){ return a.lang === "en"; }).length;
  var gh = list.filter(function(a){ return a.platform === "github"; }).length;

    '<div class="stat"><b>' + list.length + ' <i>条</i></b><span>收录情报</span></div>' +
    '<div class="stat"><b>' + okSrc + ' / ' + rep.statuses.length + '</b><span>可用信源</span></div>' +
    '<div class="stat"><b>' + zh + ' / ' + en + '</b><span>中文 / 英文</span></div>' +
    '<div class="stat"><b>' + (gh + papers) + '</b><span>开源 ' + gh + ' · 论文 ' + papers + '</span></div>' +
  "</div>";

function statusBarHTML(rep){
  if(!rep || !rep.statuses || !rep.statuses.length) return "";
  var chips = rep.statuses.slice().sort(function(a, b){
    return (a.ok === b.ok) ? a.name.localeCompare(b.name) : (a.ok ? -1 : 1);
  }).map(function(s){
    if(s.ok){
      return '<span class="chip ok" title="耗时 ' + s.ms + 'ms">' + esc(s.name) + "<b>" + s.count + "</b></span>";
    }
    return '<span class="chip fail" title="' + esc(s.error || "失败") + '">' + esc(s.name) + "<b>×</b></span>";
  }).join("");

  var bad = rep.statuses.filter(function(s){ return !s.ok; }).length;
  var tip = bad === 0
    ? "全部信源采集成功"
    : (bad + " 个信源失败（多为代理限流或网络波动，鼠标悬停查看原因）");

  return '<div class="end-mark">本期完</div>' +
         '<div class="status-bar"><div class="st-head"><b>采集状态</b>' +
         '<span>更新于 ' + fmtDate(rep.generatedAt) + " " + fmtClock(rep.generatedAt) + " · " + tip + "</span>" +
         '</div><div class="chips">' + chips + "</div></div>";
}

function briefHTML(rep, days){
  var p = PERIODS[rep.period] || PERIODS.daily;
  var list = filtered(rep.articles);
  if(!list.length) return "";
  var byCat = {};
  list.forEach(function(a){ byCat[a.cat] = (byCat[a.cat] || 0) + 1; });
  var topCat = Object.keys(byCat).sort(function(a, b){ return byCat[b] - byCat[a]; })[0];
  var gh = list.filter(function(a){ return a.platform === "github"; })
    .sort(function(a, b){ return (b.extra ? b.extra.stars : 0) - (a.extra ? a.extra.stars : 0); })[0];
  var parts = [];
  parts.push(p.cn + "共收录 <b>" + list.length + "</b> 条情报");

  var papers = list.filter(function(a){ return a.platform === "arxiv"; }).length;
  if(papers) parts.push("论文速递 " + papers + " 篇");
  return '<p class="lead-sum" style="border-left-color:var(--rule-strong);color:var(--muted);font-size:13px">' +
         "编辑短评：" + parts.join("；") + "。</p>";

function modelBoardHTML(rep, limit, title){
  var list = (rep && rep.trending) ? rep.trending.slice(0, limit || 10) : [];
  if(!list.length) return "";
  var max = list.reduce(function(m, a){
    return Math.max(m, Number(a.extra && a.extra.likes) || 0);
  }, 0) || 1;
  var rows = list.map(function(a, i){
    var likes = Number(a.extra && a.extra.likes) || 0;
    var dl = Number(a.extra && a.extra.downloads) || 0;
    var task = (a.extra && a.extra.task) || "模型";
    var name = String(a.title || "").split(" · ")[0];
    var pct = Math.max(4, Math.round(likes / max * 100));
    return '<div class="m-row">' +
      '<span class="m-no">' + (i + 1) + "</span>" +
      '<span class="m-name"><a href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer" title="' +
        esc(name + " · " + task) + '">' + esc(name) + '</a><span class="m-task">' + esc(task) + "</span></span>" +
      '<span class="m-bar"><i style="width:' + pct + '%"></i></span>' +
      '<span class="m-val">' + fmtNum(likes) + "</span>" +
      '<span class="m-dl">' + fmtNum(dl) + "</span>" +
    "</div>";
  }).join("");

  return '<section class="model-board">' +
      '<div class="board-head"><h3>' + esc(title || "模型排行榜") + '</h3><span class="en">实时热度</span>' +
        '<span class="note">Hugging Face 趋势模型 · 按点赞热度</span></div>' +

        '<div class="m-head"><span>#</span><span>模型 / 任务</span><span>热度</span><span>点赞</span><span>下载</span></div>' +
        rows +
      "</div>" +
    "</section>";
}

   9. 渲染：周报 / 月报公用部件
   ========================================================= */
function buckets(articles, days){
  var now = new Date(); now.setHours(0, 0, 0, 0);
  var arr = [];
  for(var i = days - 1; i >= 0; i--){
    var d = new Date(now.getTime() - i * DAY);
    arr.push({ key: d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(), label: (d.getMonth()+1) + "/" + d.getDate(), n: 0 });
  }
  var index = {};
  arr.forEach(function(b, i){ index[b.key] = i; });
  articles.forEach(function(a){
    var d = new Date(a.ts);
    var k = d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
    var i = index[k];
    if(i != null) arr[i].n++;
  });
  return arr;
}
function barChartHTML(articles, days){
  var bs = buckets(articles, days);
  var max = Math.max.apply(null, bs.map(function(b){ return b.n; }).concat([1]));
  var bars = bs.map(function(b){
    var h = Math.max(2, Math.round(b.n / max * 100));
    return '<div class="bar' + (b.n ? "" : " b0") + '" title="' + b.label + "：" + b.n + ' 条"><i style="height:' + h + '%"></i></div>';
  }).join("");
  var step = days > 10 ? Math.ceil(days / 10) : 1;
  var labels = bs.map(function(b, i){
    return "<span>" + (i % step === 0 ? b.label : "") + "</span>";
  }).join("");
  return '<div class="bars">' + bars + '</div><div class="bar-labels">' + labels + "</div>";
}
function hbarsHTML(entries, total, limit){
  var top = entries.slice(0, limit || 8);
  var max = Math.max.apply(null, top.map(function(e){ return e.n; }).concat([1]));
  return top.map(function(e){
    var pct = Math.round(e.n / max * 100);
    return '<div class="hbar"><span class="lb" title="' + esc(e.k) + '">' + esc(e.k) + "</span>" +
           '<span class="tr"><i style="width:' + pct + '%"></i></span>' +
           '<span class="vl">' + e.n + "</span></div>";
  }).join("");
}
function countBy(list, fn){
  var m = {};
  list.forEach(function(a){
    var k = fn(a) || "其他";
    m[k] = (m[k] || 0) + 1;
  });
  return Object.keys(m).map(function(k){ return { k: k, n: m[k] }; })
    .sort(function(a, b){ return b.n - a.n; });
}

var STOP_EN = ("the,a,an,and,or,of,to,in,for,on,with,is,are,was,were,be,been,it,its,this,that,these,those,as,at,by,from,new,how,why,what,when,who,will,can,could,would,should,has,have,had,not,but,more,most,than,then,so,we,you,they,their,our,your,about,into,over,after,before,up,down,out,just,only,also,may,might,like,get,gets,one,two,first,last,now,its,it's,ai,artificial,intelligence,openai,google,microsoft,meta,apple,amazon,tech,technology,report,reports,says,said,new,news,model,models,use,using,used,user,users,best,top,why,what").split(",");
var STOP_ZH = ("人工智能,大模型,模型,智能,技术,公司,表示,消息,今天,可能,如何,什么,这个,那个,以及,通过,进行,目前,已经,可以,需要,用户,市场,全球,中国,美国,记者,报道,新闻,最新,重磅,刚刚,首次,正式,全面,宣布,推出,发布,上线,全新,首个,一个,我们,他们,你们,自己,但是,因为,所以,如果,没有,就是,还是,这种,这次,今年,去年,明年,以来,以上,以下,方面,领域,问题,情况,相关,有关,其中,同时,此外,目前,正在,已经,将,会,为,与,和,及,或,等,的,了,是,在,有,也,就,都,被,把,对,从,到,以,于,并,而,其,之,者,上,下").split(",");
var STOP_EN_SET = new Set(STOP_EN);
var STOP_ZH_SET = new Set(STOP_ZH);

function topKeywords(list, limit){
  var freq = new Map();
  function add(k, w){
    k = k.trim();
    if(!k || k.length < 2) return;
    freq.set(k, (freq.get(k) || 0) + w);
  }
  list.forEach(function(a){
    var title = a.title || "";
    var text = (title + " " + (a.summary || "")).toLowerCase();

    (text.match(/[a-z][a-z0-9\-]{2,20}/g) || []).forEach(function(w){
      if(STOP_EN_SET.has(w) || /^\d+$/.test(w)) return;
      add(w, 1.2);
    });

    var zh = title.replace(/[^\u4e00-\u9fa5]+/g, " ");
    zh.split(/\s+/).forEach(function(seg){
      if(seg.length < 2) return;
      [2, 3, 4].forEach(function(n){
        if(seg.length < n) return;
        for(var i = 0; i + n <= seg.length; i++){
          var g = seg.slice(i, i + n);
          if(STOP_ZH_SET.has(g)) continue;
          add(g, n === 2 ? 1 : 1.5);
        }
      });
    });
  });

  var cands = Array.from(freq.entries())
    .filter(function(e){ return e[1] >= 3; })
    .sort(function(a, b){ return b[1] - a[1]; })
    .slice(0, 140)
    .map(function(e){ return { k: e[0], n: e[1] }; });

  // 去掉被更长高频词包含的短词（如「智能体」里的「智能」）
  var out = [];
  for(var i = 0; i < cands.length; i++){
    var c = cands[i], covered = false;
    for(var j = 0; j < out.length; j++){
      var o = out[j];
      if(o.k.indexOf(c.k) !== -1 && o.n >= c.n * 0.75){ covered = true; break; }
      if(c.k.indexOf(o.k) !== -1 && c.n >= o.n * 1.2){ out.splice(j, 1); j--; }
    }
    if(!covered) out.push(c);
    if(out.length >= (limit || 30)) break;
  }
  return out.slice(0, limit || 30);
}

function cloudHTML(list){
  var kws = topKeywords(list, 30);
  if(!kws.length) return '<p class="hint">数据量不足，暂无法生成关键词。</p>';
  var max = kws[0].n, min = kws[kws.length - 1].n;
  return '<div class="cloud">' + kws.map(function(k){
    var ratio = (k.n - min) / Math.max(1, max - min);
    var size = (13 + ratio * 21).toFixed(1);
    return '<span style="font-size:' + size + 'px" title="出现 ' + k.n + ' 次">' + esc(k.k) + "</span>";
  }).join("") + "</div>";
}

function topListHTML(list, period, count){
  return '<div class="top-list">' + list.slice(0, count || 6).map(function(a, i){
    return '<article class="top-item"><div class="no">' + pad2(i + 1) + "</div><div>" +
      '<h4><a href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">' + esc(a.title) + "</a></h4>" +
      '<div class="meta"><span>' + esc(a.source) + "</span><span>" + fmtTime(a.ts, period) + "</span>" +
      (a.platform === "github" && a.extra ? "<span>★ " + fmtNum(a.extra.stars) + "</span>" : "") +
      (a.platform === "hn" ? "<span>热度 " + a.weight + "</span>" : "") + "</div>" +
      (a.summary ? '<p class="sum">' + esc(a.summary) + "</p>" : "") +
      "</div></article>";
  }).join("") + "</div>";
}

function timelineHTML(list, period){
  if(!list.length) return "";
  return '<div class="timeline">' + list.map(function(a){
    return '<div class="tl-item"><time>' + fmtTime(a.ts, period) + '</time><div class="tx">' +
      '<a href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">' + esc(a.title) + "</a>" +

function loadArena(dim){
  var url = "https://www.ai-club.cn/rank/arena" + (dim && dim !== "text" ? "/" + dim : "");
  return memo("arena:" + dim, 10 * 60000, function(){
    return fetchViaProxy(url, 25000).then(function(html){
      var doc = new DOMParser().parseFromString(html, "text/html");
      var rows = doc.querySelectorAll("tr.ar-row");
      if(!rows.length) throw new Error("榜单解析失败，页面结构可能已变更");
      var models = [];
      Array.prototype.forEach.call(rows, function(tr){
        var a = tr.querySelector(".ar-mlink");
        if(!a) return;
        var score = parseFloat((tr.querySelector(".ar-score") || {}).textContent);
        var ci = parseFloat(((tr.querySelector(".ar-ci") || {}).textContent || "").replace(/[^\d.]/g, ""));
        var votes = parseInt(((tr.querySelector(".ar-votes") || {}).textContent || "").replace(/[^\d]/g, ""), 10);
        var logoEl = tr.querySelector(".ar-logo");
        var logo = logoEl ? (logoEl.getAttribute("src") || "") : "";
        if(logo && logo.charAt(0) === "/") logo = "https://www.ai-club.cn" + logo;
        models.push({
          rank: parseInt(tr.getAttribute("data-rank"), 10) || models.length + 1,
          name: a.textContent.trim(),
          url: "https://www.ai-club.cn" + (a.getAttribute("href") || ""),
          vendor: tr.getAttribute("data-vendor") || "",
          country: tr.getAttribute("data-country") || "",
          logo: logo,
          score: isNaN(score) ? 0 : score,
          ci: isNaN(ci) ? 0 : ci,
          votes: isNaN(votes) ? 0 : votes
        });
      });
      var t = doc.querySelector(".ar-chips time");
      return {
        dim: dim,
        dimName: arenaDimLabel(dim),
        synced: t ? t.textContent.trim() : "",
        models: models,
        at: Date.now()
      };
    });
  });
}

function saveArenaCache(){

function ensureArena(dim, force){
  dim = dim || State.arenaDim || "text";
  if(State.arenaData && State.arenaData.dim !== dim) State.arenaData = null;
  State.arenaDim = dim;
  var hit = State.arenaCache[dim];
  if(!force && hit && hit.data && Date.now() - hit.at < ARENA_TTL){
    State.arenaData = hit.data;
    State.arenaError = null;
    State.arenaLoading = false;
    if(State.period === "models"){ renderModels(); updateStatusLine(); }
    return;
  }
  if(State.arenaLoading && State.arenaLoadingDim === dim) return;
  State.arenaLoading = true;
  State.arenaLoadingDim = dim;
  State.arenaError = null;
  if(State.period === "models") renderModels();
  loadArena(dim).then(function(data){
    State.arenaLoading = false;
    State.arenaData = data;
    State.arenaCache[dim] = { at: Date.now(), data: data };
    saveArenaCache();
    if(State.period === "models"){ renderModels(); updateStatusLine(); updateMasthead(); }
  }).catch(function(err){
    State.arenaLoading = false;
    State.arenaError = describeError(err) || "获取失败";

  return top.map(function(m, i){
    var pct = Math.max(8, Math.round((m.score - base) / ((max - base) || 1) * 100));
    return '<div class="elo-row"><span class="elo-no">' + (m.rank || i + 1) + "</span>" +
      '<span class="elo-name" title="' + esc(m.name + " · " + m.vendor) + '">' + esc(m.name) + "</span>" +

function ghTopicCN(t){
  return GH_TOPIC_CN[String(t || "").toLowerCase()] || "";
}

function ghSearch(q, per, sort){
  var url = "https://api.github.com/search/repositories?q=" + encodeURIComponent(q) +
            "&sort=" + (sort || "stars") + "&order=desc&per_page=" + (per || 30);
  var headers = { "Accept": "application/vnd.github+json" };
  if(State.ghToken) headers["Authorization"] = "Bearer " + State.ghToken;
  return fetchJSON(url, { headers: headers }).then(function(d){
    if(!d.items) throw new Error((d.message || "GitHub 返回异常").slice(0, 60));
    return d.items;
  });
}

function ghNormalize(r){
  return {
    full: r.full_name,
    url: r.html_url,
    desc: String(r.description || "").trim(),
    zh: "",
    stars: r.stargazers_count || 0,
    forks: r.forks_count || 0,
    lang: r.language || "",
    topics: (r.topics || []).slice(0, 6),
    pushed: Date.parse(r.pushed_at) || 0,
    created: Date.parse(r.created_at) || 0
  };
}

function loadGithubHub(){
  var since = new Date(Date.now() - 30 * DAY).toISOString().slice(0, 10);
  var active = new Date(Date.now() - 180 * DAY).toISOString().slice(0, 10);
  var queries = [
    "topic:ai stars:>1000 pushed:>" + active,
    "topic:llm stars:>300 pushed:>" + active,
    "topic:ai created:>" + since
  ];
  return Promise.all(queries.map(function(q){
    return attemptTask(function(){ return ghSearch(q, 30); }, 1).catch(function(){ return []; });
  })).then(function(groups){
    var seen = {}, list = [];
    groups.forEach(function(items){
      items.forEach(function(r){
        if(!r || !r.full_name || seen[r.full_name]) return;
        seen[r.full_name] = 1;
        list.push(ghNormalize(r));
      });
    });
    if(!list.length) throw new Error("GitHub 项目未获取到数据");
    var top = list.slice().sort(function(a, b){ return b.stars - a.stars; }).slice(0, 30);
    return pool(top.map(function(it){
      return function(){
        if(!it.desc) return Promise.resolve();
        return translateOne(it.desc).then(function(zh){ if(zh && zh !== it.desc) it.zh = zh; });
      };
    }), 4).then(function(){ return list; });
  });
}

function saveGhCache(){

}

function ensureGithubHub(force){
  if(!force && State.ghCache && State.ghCache.data && Date.now() - State.ghCache.at < GH_TTL){
    State.ghHub = State.ghCache.data;
    State.ghError = null;
    State.ghLoading = false;
    if(State.period === "github"){ renderGithub(); updateStatusLine(); updateMasthead(); }
    return;
  }
  if(State.ghLoading) return;
  State.ghLoading = true;
  State.ghError = null;
  if(State.period === "github") renderGithub();
  loadGithubHub().then(function(list){
    State.ghLoading = false;
    var hub = { at: Date.now(), items: list };
    State.ghHub = hub;
    State.ghCache = { at: Date.now(), data: hub };
    saveGhCache();
    if(State.period === "github"){ renderGithub(); updateStatusLine(); updateMasthead(); }
  }).catch(function(err){
    State.ghLoading = false;
    State.ghError = describeError(err) || "获取失败";
    if(State.period === "github"){ renderGithub(); updateStatusLine(); }
  });
}

    "</div>";

  var charts = '<div class="gh-charts">' +
      '<div class="panel"><h3>星标前 12<small>按星标</small></h3>' + ghStarsChartHTML(list) + "</div>" +
      '<div class="panel"><h3>语言分布<small>项目数量</small></h3>' + hbarsHTML(langEntries, all.length, 8) + "</div>" +
      '<div class="panel"><h3>主题分布<small>已中文化标签</small></h3>' +
        (tagEntries.length ? hbarsHTML(tagEntries, all.length, 8) : '<p class="hint">暂无主题标签。</p>') + "</div>" +
    "</div>";

  var rows = list.slice(0, 60).map(function(it, i){
    var tags = it.topics.map(function(t){ return ghTopicCN(t); })
      .filter(function(v, idx, arr){ return v && arr.indexOf(v) === idx; })
      .slice(0, 3).map(function(v){ return '<span class="gh-tag">' + esc(v) + "</span>"; }).join("");
    return '<tr><td class="rk">' + (i + 1) + "</td>" +
      '<td class="gh-repo">' +
        '<a href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.full) + "</a>" +
        '<span class="gh-desc">' + esc(it.zh || it.desc || "仓库暂无简介") + "</span>" +
        (tags ? '<span class="gh-tags">' + tags + "</span>" : "") + "</td>" +
      '<td class="vendor">' + esc(it.lang || "—") + "</td>" +
      '<td class="num score">' + fmtNum(it.stars) + "</td>" +
      '<td class="num votes">' + fmtNum(it.forks) + "</td>" +
      '<td class="num votes">' + fmtDate(it.pushed) + "</td></tr>";
  }).join("");

  return '<div class="ar-meta">同步时间：' + fmtDate(hub.at) + " " + fmtClock(hub.at) +
      " · 共 " + all.length + " 个项目 · 每小时同步一次 · 来源 GitHub 搜索 API</div>" +
    stats + charts +
    '<div class="ar-table-head"><h3>' + (isNew ? "新晋项目" : "热门项目") + "</h3><span>按星标降序 · 最多展示 60 个</span></div>" +
    '<div class="ar-table-wrap"><table class="ar-table gh-table"><thead><tr>' +
      "<th>排名</th><th>项目 / 中文简介</th><th>语言</th><th>星标</th><th>Fork</th><th>最近更新</th>" +
    "</tr></thead><tbody>" + rows + "</tbody></table></div>";
}

function renderGithub(){
  var head = '<div class="models-page">' +
    '<div class="page-head"><h2>GitHub 中文版</h2><span class="sub">开源项目 · 中文简介</span></div>' +
    '<p class="intro">自动收集 GitHub 上的人工智能、大模型与智能体开源项目，简介统一译为中文；每小时同步一次。' +
    "「热门项目」按星标排序，「新晋项目」取近 30 天新建仓库。</p>" +
    '<div class="arena-bar">' +
      '<button class="ar-chip' + (State.ghFilter === "hot" ? " on" : "") + '" data-gh="hot">热门项目</button>' +
      '<button class="ar-chip' + (State.ghFilter === "new" ? " on" : "") + '" data-gh="new">新晋项目</button>' +
    "</div>";

  var body;
  if(State.ghLoading){
    body = '<div class="arena-empty">正在收集 GitHub 开源项目并翻译简介…</div>';
  }else if(State.ghError && !State.ghHub){
    body = '<div class="arena-empty">GitHub 项目未能获取：' + esc(State.ghError) +
      "<br>可点工具栏「更新本期」重试；在「数据源」页填写 GitHub Token 可提高 API 配额。</div>";
  }else if(State.ghHub){
    body = githubBodyHTML(State.ghHub);
  }else{
    body = '<div class="arena-empty">正在准备 GitHub 榜单…</div>';
  }

  els.paper.innerHTML = head + body + "</div>";
  updateMasthead();
}

function renderSources(){
  var rep = State.reports[State.period] || State.reports.daily || null;
  var rows = [];
  if(rep && rep.statuses){
    rows = rep.statuses.slice().sort(function(a, b){
      if(a.ok !== b.ok) return a.ok ? -1 : 1;
      return b.count - a.count;
    }).map(function(s){
      return "<tr><td>" + esc(s.name) + "</td><td>" + esc(s.kind) + "</td>" +
        "<td class=\"" + (s.ok ? "ok" : "fail") + "\">" + (s.ok ? "正常" : "失败") + "</td>" +
        "<td>" + (s.ok ? s.count : "—") + "</td>" +
        "<td>" + (s.ok ? s.ms + " ms" : esc(s.error || "")) + "</td></tr>";
    }).join("");
  }
  var srcList = FEEDS.map(function(f){ return "<li>" + esc(f.name) + " · <code>" + esc(f.url) + "</code></li>"; }).join("") +
    GN.map(function(g){ return "<li>" + esc(g.name) + " · 查询词「" + esc(g.q) + "」</li>"; }).join("");

  els.paper.innerHTML =
    '<div class="sources-page">' +
      '<div class="panel-block"><h2>本期采集明细</h2>' +
        (rows ? '<table class="src-table"><thead><tr><th>信源</th><th>类型</th><th>状态</th><th>条数</th><th>耗时 / 原因</th></tr></thead><tbody>' +
        rows + "</tbody></table>" : '<p class="hint">本期尚未采集，点击工具栏「更新本期」。</p>') +
      "</div>" +
      '<div class="panel-block"><h2>采集设置</h2>' +
        '<div class="settings-row"><label>GitHub Token（可选）<input type="text" id="inp-token" placeholder="ghp_xxx，仅保存在本机浏览器" value="' + esc(State.ghToken) + '"></label></div>' +
        '<div class="settings-row"><label>自动刷新间隔' +
          '<select id="sel-interval">' +
            [5,15,30,60].map(function(m){
              return '<option value="' + m + '"' + (State.interval === m * 60000 ? " selected" : "") + ">" + m + " 分钟</option>";
            }).join("") +
          "</select></label>" +
          '<label class="switch"><input type="checkbox" id="chk-auto2"' + (State.auto ? " checked" : "") + "> 自动刷新开启</label>" +
          '<button class="btn primary" id="btn-save">保存设置</button>' +
          '<button class="btn" id="btn-clear">清空缓存</button>' +
        "</div>" +
        '<p class="hint">Token 只写入本机 localStorage，用于把 GitHub API 限额从 10 次/分提升到 30 次/分。<b>不需要 Token 也能正常使用。</b></p>' +
      "</div>" +
      '<div class="panel-block"><h2>本地采集服务</h2>' +
        '<p>当前状态：<b>' + (LocalProxy.ok ? "已连接 · http://127.0.0.1:8765" : "未启动") + "</b></p>" +
        '<p class="hint">浏览器出于安全限制，不能直接读取大多数媒体 RSS 与 arXiv；同目录的 <code>启动报纸.bat</code> 会启动一个只监听本机的 Node 服务（<code>server.js</code>），' +
        "由它代为抓取，再交给本页面排版。双击 <b>启动报纸.bat</b> 后刷新本页即可获得海内外全部信源；关闭弹出的最小化窗口即停止服务。</p>" +
      "</div>" +
      '<div class="panel-block"><h2>工作机制</h2>' +
        "<ul>" +
          "<li>打开页面即自动采集并排版本期报纸；数据缓存在本机，<b>15 分钟内重复打开直接秒开</b>，同时后台静默更新。</li>" +
          "<li>日报取最近 24 小时，周报取最近 7 天，月报取最近 30 天；三个版本各自独立采集、独立缓存。</li>" +
          "<li>点击「更新本期」强制重新采集；工具栏可搜索、按语言 / 来源筛选；「打印 / 存 PDF」可保存当期报纸。</li>" +
          "<li>海外 RSS 与 arXiv 通过本地采集服务读取；未启动服务时自动降级为公共 CORS 代理与直连 API（Hacker News / GitHub / Dev.to / OpenAlex）。</li>" +
        "</ul>" +
      "</div>" +
      '<div class="panel-block"><h2>信源清单</h2><ul>' + srcList + "</ul>" +
        '<p class="hint">API 信源：Hacker News（Algolia）、GitHub Search、Hugging Face、arXiv、Dev.to、OpenAlex。' +
        "如需增删信源，编辑本文件脚本中的 <code>FEEDS</code> / <code>GN</code> 数组即可。</p>" +
      "</div>" +
    "</div>";
  bindSettings();
}

function bindSettings(){
  var btnSave = $("#btn-save");
  if(btnSave){
    btnSave.addEventListener("click", function(){
      var token = ($("#inp-token").value || "").trim();
      var interval = parseInt($("#sel-interval").value, 10) || 15;
      var auto = $("#chk-auto2").checked;
      State.ghToken = token;
      State.interval = interval * 60000;
      State.auto = auto;
      safeSet(TOKEN_KEY, token);
      safeSet(INTERVAL_KEY, String(interval));
      els.chkAuto.checked = auto;
      mem.delete("hf-trending");
      els.status.textContent = "设置已保存，正在重新采集…";
      fetchPeriod(State.period, true);
    });
  }
  var btnClear = $("#btn-clear");
  if(btnClear){
    btnClear.addEventListener("click", function(){
      try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
      State.cache = {};
      State.reports = {};
      mem.clear();
      els.status.textContent = "缓存已清空";
      fetchPeriod(State.period, false);
    });
  }
}

/* =========================================================
   13. 页面调度
   ========================================================= */
function updateMasthead(){
  var d = new Date();
  var wd = "日一二三四五六".charAt(d.getDay());
  els.mastDate.textContent = d.getFullYear() + " 年 " + (d.getMonth()+1) + " 月 " + d.getDate() + " 日 · 星期" + wd + " · " + fmtClock(d.getTime());
  els.mastIssue.textContent = pad3(dayOfYear(d));
  if(State.period === "models"){
    var a = State.arenaData;
    els.footMeta.textContent = a
      ? "模型排行 · " + a.dimName + " · " + a.models.length + " 个模型 · 数据来自 AI Club Arena"
      : "模型排行 · 数据来自 AI Club Arena（ai-club.cn）";
    return;
  }
  if(State.period === "github"){
    var g = State.ghHub;
    els.footMeta.textContent = g
      ? "GitHub 中文版 · 共 " + g.items.length + " 个项目 · 同步于 " + fmtDate(g.at) + " " + fmtClock(g.at)
      : "GitHub 中文版 · 数据来自 GitHub 搜索 API";
    return;
  }
  var rep = State.reports[State.period];
  var p = PERIODS[State.period] || PERIODS.daily;
  els.footMeta.textContent = rep
    ? p.label + " · 共 " + rep.articles.length + " 条 · 生成于 " + fmtDate(rep.generatedAt) + " " + fmtClock(rep.generatedAt)
    : "本期尚未生成 · " + fmtDate(d.getTime()) + " " + fmtClock(d.getTime());
}

function buildTicker(){
  var rep = State.reports.daily;
  if(!rep || !rep.articles.length){ els.ticker.hidden = true; return; }
  var top = rep.articles.slice().sort(function(a, b){ return heatOf(b, 1) - heatOf(a, 1); }).slice(0, 8);
  var html = top.map(function(a){
    return '<a href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">' + esc(a.title) + "<b>" + esc(a.source) + "</b></a>";
  }).join("");
  els.tickerTrack.innerHTML = html + html;
  els.ticker.hidden = false;
}

function updateSourceSelect(rep){
  var counts = {};
  (rep.articles || []).forEach(function(a){ counts[a.source] = (counts[a.source] || 0) + 1; });
  var names = Object.keys(counts).sort(function(a, b){ return counts[b] - counts[a]; });
  if(Filter.src !== "all" && names.indexOf(Filter.src) === -1) Filter.src = "all";
  els.src.innerHTML = '<option value="all">全部来源</option>' + names.map(function(n){
    return '<option value="' + esc(n) + '"' + (Filter.src === n ? " selected" : "") + ">" + esc(n) + " (" + counts[n] + ")</option>";
  }).join("");
}

function renderPeriod(period){
  var rep = State.reports[period];
  if(!rep){ renderLoading(period); return; }
  updateSourceSelect(rep);
  if(period === "daily") els.paper.innerHTML = renderDaily(rep);
  else if(period === "weekly") els.paper.innerHTML = renderWeekly(rep);
  else if(period === "monthly") els.paper.innerHTML = renderMonthly(rep);
  else renderSources();
  buildTicker();
  updateMasthead();
}

function updateStatusLine(){
  if(State.period === "models"){
    var a = State.arenaData;
    els.status.classList.remove("busy");
    if(State.arenaLoading) els.status.textContent = "模型排行 · 正在获取 Elo 榜单…";
    else if(a) els.status.textContent = "Elo 榜 · " + a.dimName + " · 同步于 " + (a.synced || "—");
    else if(State.arenaError) els.status.textContent = "模型排行 · 获取失败";
    else els.status.textContent = "模型排行 · 等待获取";
    return;
  }
  if(State.period === "github"){
    els.status.classList.remove("busy");
    if(State.ghLoading) els.status.textContent = "GitHub 中文 · 正在收集开源项目…";
    else if(State.ghHub) els.status.textContent = "GitHub 中文 · " + State.ghHub.items.length + " 个项目 · 同步于 " + fmtClock(State.ghHub.at);
    else if(State.ghError) els.status.textContent = "GitHub 中文 · 获取失败";
    else els.status.textContent = "GitHub 中文 · 等待获取";
    return;
  }
  var rep = State.reports[State.period];
  if(State.busy){ els.status.textContent = "正在采集并排版…"; els.status.classList.add("busy"); return; }
  els.status.classList.remove("busy");
  if(!rep){ els.status.textContent = "尚未采集"; return; }
  var total = rep.articles.length;
  els.status.textContent = "更新于 " + fmtClock(rep.generatedAt) + " · 共 " + total + " 条";
}

function setBusy(b){
  State.busy = b;
  els.btnRefresh.disabled = b;
  els.btnRefresh.textContent = b ? "采集中…" : "更新本期";
  updateStatusLine();
}

function fetchPeriod(period, silent, done){
  if(State.loading[period]) return;
  State.loading[period] = true;
  var isCurrent = State.period === period;
  var hasData = !!State.reports[period];

  if(isCurrent){
    if(!hasData || !silent) renderLoading(period);
    setBusy(true);
  }

  collect(period, function(statuses){
    if(isCurrent && !hasData) updateLoadingChips(statuses);
  }).then(function(rep){
    State.reports[period] = rep;
    State.cache[period] = { at: Date.now(), report: rep };
    saveCache();
    if(State.period === period) renderPeriod(period);
    else if(State.period === "models" && period === "daily") renderModels();
    if(period === "daily"){
      // 后台预取周报 / 月报，切换标签即可秒开
      setTimeout(function(){ ensurePeriod("weekly"); }, 4000);
      setTimeout(function(){ ensurePeriod("monthly"); }, 11000);
    }
    if(done) done(null, rep);
  }).catch(function(err){
    if(State.period === period && !State.reports[period]) renderError(err, period);
    if(done) done(err);
  }).then(function(){
    State.loading[period] = false;
    if(State.period === period){ setBusy(false); }
    updateStatusLine();
  });
}

function ensurePeriod(period, force){
  if(State.loading[period]) return;
  var cached = State.cache[period];
  if(cached && cached.report){
    State.reports[period] = State.reports[period] || cached.report;
    if(State.period === period && !force) renderPeriod(period);
    if(!force && Date.now() - cached.at < TTL) return;
  }
  if(force || !cached){
    fetchPeriod(period, !!cached);
  }else{
    // 缓存过期：先展示旧报，再静默更新
    if(State.period === period) renderPeriod(period);
    fetchPeriod(period, true);
  }
}

function saveCache(){
  var slim = {};
  Object.keys(State.cache).forEach(function(k){
    var c = State.cache[k];
    if(c && c.report){
      slim[k] = { at: c.at, report: c.report };
    }
  });
  try{
    safeSet(CACHE_KEY, JSON.stringify(slim));
  }catch(e){
    // 超出配额时只保留日报
    try{ safeSet(CACHE_KEY, JSON.stringify({ daily: slim.daily })); }catch(e2){}
  }
}

function switchTab(period){
  if(State.period === period) return;
  Filter.q = "";
  Filter.lang = "all";
  Filter.src = "all";
  els.search.value = "";
  els.lang.value = "all";
  els.src.value = "all";
  State.period = period;
  $$(".tab").forEach(function(t){
    t.classList.toggle("active", t.getAttribute("data-period") === period);
  });
  if(period === "sources"){ renderSources(); updateStatusLine(); return; }
  if(period === "models"){ ensureArena(State.arenaDim); updateStatusLine(); return; }
  if(period === "github"){ ensureGithubHub(false); updateStatusLine(); return; }
  if(!State.reports[period]) renderLoading(period);
  else renderPeriod(period);
  updateStatusLine();
  ensurePeriod(period);
}

/* =========================================================
   14. 事件绑定
   ========================================================= */
els.tabs.addEventListener("click", function(e){
  var tab = e.target.closest(".tab");
  if(!tab) return;
  switchTab(tab.getAttribute("data-period"));
});

els.btnRefresh.addEventListener("click", function(){
  if(State.period === "sources"){ switchTab("daily"); return; }
  if(State.period === "models"){
    ensureArena(State.arenaDim, true);
    return;
  }
  if(State.period === "github"){
    LocalProxy.ready = null;
    detectLocalProxy(true).then(function(){ ensureGithubHub(true); });
    return;
  }
  LocalProxy.ready = null;
  detectLocalProxy(true).then(function(){ fetchPeriod(State.period, true); });
});

$("#proxy-flag").addEventListener("click", function(){
  LocalProxy.ready = null;
  detectLocalProxy(true).then(function(){
    els.status.textContent = LocalProxy.ok ? "本地服务已连接，点击「更新本期」重新采集" : "未发现本地服务，请双击「启动报纸.bat」";
  });
});

els.btnPrint.addEventListener("click", function(){ window.print(); });

els.chkAuto.checked = State.auto;
els.chkAuto.addEventListener("change", function(){
  State.auto = els.chkAuto.checked;
});

var searchTimer = null;
els.search.addEventListener("input", function(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){
    Filter.q = els.search.value;
    if(["daily","weekly","monthly"].indexOf(State.period) !== -1) renderPeriod(State.period);
  }, 220);
});
els.lang.addEventListener("change", function(){
  Filter.lang = els.lang.value;
  if(["daily","weekly","monthly"].indexOf(State.period) !== -1) renderPeriod(State.period);
});
els.src.addEventListener("change", function(){
  Filter.src = els.src.value;
  if(["daily","weekly","monthly"].indexOf(State.period) !== -1) renderPeriod(State.period);
});

els.paper.addEventListener("click", function(e){
  var dim = e.target.closest("[data-dim]");
  if(dim){
    ensureArena(dim.getAttribute("data-dim"), false);
    return;
  }
  var ghf = e.target.closest("[data-gh]");
  if(ghf){
    State.ghFilter = ghf.getAttribute("data-gh");
    renderGithub();
    return;
  }
  var retry = e.target.closest("[data-retry]");
  if(retry){
    if(State.period === "models"){ ensureArena(State.arenaDim, true); return; }
    if(State.period === "github"){ ensureGithubHub(true); return; }
    fetchPeriod(State.period === "sources" ? "daily" : State.period, false);
  }
});

document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible"){
    if(State.period === "models"){
      var d = State.cache.daily;
      if(State.auto && (!d || Date.now() - d.at > State.interval)){
        LocalProxy.ready = null;
        fetchPeriod("daily", true);
      }
      return;
    }
    if(State.period === "github"){
      if(State.auto && (!State.ghCache || Date.now() - State.ghCache.at > GH_TTL)){
        LocalProxy.ready = null;
        ensureGithubHub(true);
      }
      return;
    }
    var cached = State.cache[State.period];
    if(State.auto && (!cached || Date.now() - cached.at > State.interval)){
      LocalProxy.ready = null;
      if(State.period !== "sources") fetchPeriod(State.period, true);
    }
  }
});

setInterval(function(){
  if(!State.auto || document.hidden) return;
  if(State.period === "sources" || State.period === "models" || State.period === "github") return;
  var cached = State.cache[State.period];
  if(!cached || Date.now() - cached.at > State.interval){
    LocalProxy.ready = null;
    fetchPeriod(State.period, true);
  }
}, 60000);

/* =========================================================
   15. 启动
   ========================================================= */
(function init(){
  State.cache = safeJSON(CACHE_KEY, {}) || {};
  State.arenaCache = safeJSON(ARENA_KEY, {}) || {};
  State.ghCache = safeJSON(GH_KEY, {}) || {};
  var cachedDaily = State.cache.daily && State.cache.daily.report;
  if(cachedDaily){
    State.reports.daily = cachedDaily;
    renderDaily(cachedDaily);
    updateSourceSelect(cachedDaily);
    buildTicker();
  }else{
    renderLoading("daily");
  }
  updateMasthead();
  updateStatusLine();
  detectLocalProxy();

  // 打开即更新：有缓存先读缓存，同时后台刷新
  ensurePeriod("daily");
})();

})();
</script>
